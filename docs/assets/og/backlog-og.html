<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backlog Syntax — Open Graph</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("./bricolage-grotesque-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 200 800;
      }

      @font-face {
        font-family: "Public Sans";
        src: url("./public-sans-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
      }

      .og-card {
        position: relative;
        isolation: isolate;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #f3f3f0;
        font-family: "Public Sans", Arial, sans-serif;
        background: #0a0a0a;
      }

      .og-card__visual,
      .og-card__shade,
      .og-card__mesh,
      .og-card__glow {
        position: absolute;
        inset: 0;
      }

      .og-card__visual {
        z-index: -4;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .og-card__shade {
        z-index: -3;
        background:
          linear-gradient(90deg, rgba(10, 10, 10, 0.99) 0%, rgba(10, 10, 10, 0.96) 31%, rgba(10, 10, 10, 0.76) 48%, rgba(10, 10, 10, 0.04) 76%),
          linear-gradient(0deg, rgba(10, 10, 10, 0.78) 0%, transparent 30%);
      }

      .og-card__mesh {
        z-index: -2;
        opacity: 0.16;
        background-image:
          linear-gradient(rgba(223, 255, 79, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(223, 255, 79, 0.12) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(90deg, #000, transparent 48%);
      }

      .og-card__glow {
        z-index: -1;
        background: radial-gradient(circle at 7% 91%, rgba(223, 255, 79, 0.14), transparent 27%);
      }

      .og-card__frame {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(243, 243, 240, 0.12);
        border-radius: 25px;
        pointer-events: none;
      }

      .og-card__content {
        display: flex;
        flex-direction: column;
        width: 610px;
        height: 100%;
        padding: 48px 0 42px 58px;
      }

      .og-card__brand {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .og-card__wordmark {
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-size: 32px;
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .og-card__wordmark-dot {
        color: #dfff4f;
      }

      .og-card__brand-line {
        width: 1px;
        height: 35px;
        background: rgba(243, 243, 240, 0.22);
      }

      .og-card__syntax-logo {
        width: 43px;
        height: 43px;
        object-fit: contain;
      }

      .og-card__kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 71px;
        color: #a0a29a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .og-card__kicker::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #dfff4f;
        box-shadow: 0 0 20px rgba(223, 255, 79, 0.78);
        content: "";
      }

      .og-card__title {
        max-width: 570px;
        margin: 22px 0 0;
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-size: 71px;
        font-weight: 730;
        letter-spacing: -0.058em;
        line-height: 0.94;
      }

      .og-card__title-accent {
        color: #dfff4f;
      }

      .og-card__description {
        max-width: 520px;
        margin: 24px 0 0;
        color: #b9bbb4;
        font-size: 22px;
        font-weight: 450;
        letter-spacing: -0.02em;
        line-height: 1.35;
      }

      .og-card__footer {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: auto;
        color: #f3f3f0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }

      .og-card__footer-line {
        width: 52px;
        height: 1px;
        background: #dfff4f;
      }
    </style>
  </head>
  <body>
    <article id="backlog-og" class="og-card" aria-label="Imagem de compartilhamento do Backlog Syntax">
      <img class="og-card__visual" src="./background-gpt-image-2.png" alt="" />
      <div class="og-card__shade"></div>
      <div class="og-card__mesh"></div>
      <div class="og-card__glow"></div>
      <div class="og-card__frame"></div>

      <div class="og-card__content">
        <div class="og-card__brand">
          <span class="og-card__wordmark">backlog<span class="og-card__wordmark-dot">.</span></span>
          <span class="og-card__brand-line"></span>
          <img
            class="og-card__syntax-logo"
            src="../../../apps/web/public/brand/syntax-lab-white.png"
            alt="Syntax Lab"
          />
        </div>

        <div class="og-card__kicker">Pessoas e agentes no mesmo quadro</div>
        <h1 class="og-card__title">
          Seu agente termina.<br />
          <span class="og-card__title-accent">O contexto fica.</span>
        </h1>
        <p class="og-card__description">Backlog multi-tenant com REST, MCP e WebMCP.</p>

        <div class="og-card__footer">
          <span class="og-card__footer-line"></span>
          <span>backlog.syntaxlab.com.br</span>
        </div>
      </div>
    </article>
  </body>
</html>
